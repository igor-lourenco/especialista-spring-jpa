spring.application.name=especialista-spring-jpa
server.port=9100

# ===============================
# Datasource (conexao com o MySQL)
# ===============================
spring.datasource.url=jdbc:mysql://192.168.0.54:3307/especialista_spring_jpa_db?createDatabaseIfNotExist=true&useTimezone=true&serverTimezone=UTC
spring.datasource.username=appuser
spring.datasource.password=L@ur&nco@Mysql135
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.open-in-view=false

# ===============================
# JPA / Hibernate
# ===============================

# Exibir SQL no console
spring.jpa.show-sql=true

# Formatar SQL
spring.jpa.properties.hibernate.format_sql=true

# estrategias de geracao das tabelas (acao de geracao do schema - DDL)
# opcoes aceitas: none, create, create-drop, update, validate
spring.jpa.hibernate.ddl-auto=validate


# Spring executa scripts SQL
spring.sql.init.mode=never
#spring.sql.init.mode=always
#spring.sql.init.schema-locations=classpath:schema.sql
#spring.sql.init.data-locations=classpath:data.sql

# Geracao de scripts
#spring.jpa.properties.jakarta.persistence.schema-generation.scripts.action=create
#spring.jpa.properties.jakarta.persistence.schema-generation.scripts.create-target=src/main/resources/ddl.sql
#spring.jpa.properties.hibernate.hbm2ddl.charset_name=UTF-8


# ===============================
#  Hikari CP
# ===============================
logging.level.com.zaxxer.hikari=INFO
spring.datasource.hikari.minimum-idle=8
spring.datasource.hikari.maximum-pool-size=16
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000


# ===============================
#  EhCache
# ===============================
spring.cache.type=jcache
spring.cache.jcache.config=classpath:ehcache.xml